<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="moneyexpenx">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MoneyExpenx - Quản lý chi tiêu thông minh</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading">
    <style>
      body {
        background-color: #09090B;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #09090B;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .logo {
        margin-bottom: 24px;
        animation: pulse 2.5s infinite ease-in-out;
      }
      .title {
        color: #F4F4F5;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 1.5px;
      }
      .tagline {
        color: #A1A1AA;
        font-size: 14px;
        margin-bottom: 32px;
        letter-spacing: 0.5px;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 3.5px solid rgba(255, 215, 0, 0.15);
        border-radius: 50%;
        border-top-color: #FFD700;
        animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.08); opacity: 1; }
      }
    </style>
    <div class="container">
      <!-- Material Icons account_balance_wallet_outlined SVG Path -->
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" height="88" viewBox="0 -960 960 960" width="88" fill="#FFD700">
        <path d="M140-160q-24 0-42-18t-18-42v-520q0-24 18-42t42-18h500q24 0 42 18t18 42v10h120q24 0 42 18t18 42v320q0 24-18 42t-42 18H140Zm0-60h680v-320H680v10q0 24-18 42t-42 18H140v250Zm540-380h140v-80H680v80Zm-540 60h480v-200H140v200Zm0 0v-200 200Z"/>
      </svg>
      <div class="title">MoneyExpenx</div>
      <div class="tagline">Quản lý chi tiêu thông minh</div>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Remove loading screen when Flutter is ready to draw first frame -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.style.transition = 'opacity 0.4s ease';
        loadingDiv.style.opacity = '0';
        setTimeout(function() {
          loadingDiv.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
